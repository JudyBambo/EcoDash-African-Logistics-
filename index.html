<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Dash</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START GAME SCREEN -->
    <div id="startScreen">
      <h1>Kenya Medical Drone</h1>

      <p>Medical Supply Run</p>

      <p>Use the arrow keys to fly.</p>

      <button id="startButton">Start Game</button>
    </div>

    <button id="pauseButton">Pause</button>

    <div>
      <h1>Game Paused</h1>
      <button id="resumeButton">Resume</button>
    </div>

    <!-- GAMEOVER SCREEN -->
    <div id="gameOverScreen">
      <h1>Game Over</h1>

      <p>Score: <span id="finalScore">0</span></p>

      <p>Delivered: <span id="finalDelivered">0</span></p>

      <p>Missed: <span id="finalMissed">0</span></p>

      <button id="restartButton">Play Again</button>
    </div>

    <!-- HUD -->
    <div id="score">0</div>
    <div id="battery">100%</div>
    <div id="delivered">0</div>
    <div id="distance">0</div>
    <div id="missed">0</div>

    <canvas id="canvas"></canvas>

    <script src="script.js"></script>
  </body>
</html>
